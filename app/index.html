<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Similar companies</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; background: #fafafa; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
    .company h1 { margin: 0 0 4px; font-size: 24px; }
    .muted { color: #666; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; cursor: pointer; }
    .card:hover { border-color: #2563eb; }
    .card b { display: block; margin-bottom: 4px; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <!-- 1. Search box -->
  <form id="search">
    <input id="reg" placeholder="Registration number, e.g. SYN-001550" value="SYN-001550">
    <button>Show</button>
  </form>

  <!-- 2. Results are drawn in here -->
  <div id="result"></div>

  <script>
    const result = document.getElementById("result");

    // Ask the API for a company and its similar companies, then draw the page.
    async function showCompany(reg) {
      document.getElementById("reg").value = reg;
      result.innerHTML = "<p class='muted'>Loading...</p>";

            // 1. Get the company itself
      const companyResponse = await fetch(`/company/${encodeURIComponent(reg)}`);
      const company = await companyResponse.json();

      if (!companyResponse.ok) {
        result.innerHTML = `<p class="error">${companyResponse.status}: ${escapeHtml(company.detail)}</p>`;
        return;
      }

      let html = `
        <div class="company">
          <h1>${escapeHtml(company.company_name)}</h1>
          <div class="muted">${escapeHtml(company.registration_number)} · ${escapeHtml(company.industry)} · ${escapeHtml(company.state)}</div>
        </div>
        <h2>Similar companies</h2>`;

      // 2. Then get its similar companies
      const similarResponse = await fetch(`/company/${encodeURIComponent(reg)}/similar`);
      const similar = await similarResponse.json();

      if (!similarResponse.ok || similar.length === 0) {
        html += `<p class="muted">No similar companies found.</p>`;
      } else {
        html += `<div class="grid">`;
        for (const s of similar) {
          html += `
            <div class="card" data-reg="${escapeHtml(s.registration_number)}">
              <b>${escapeHtml(s.company_name)}</b>
              <span class="muted">${escapeHtml(s.industry)} · ${escapeHtml(s.state)}</span>
            </div>`;
        }
        html += `</div>`;
      }
      result.innerHTML = html;

      // Clicking a card opens that company, like on the portal.
      for (const card of result.querySelectorAll(".card")) {
        card.addEventListener("click", () => showCompany(card.dataset.reg));
      }
    }

    // Company names come from the feed, so never put them into the page as raw HTML.
    function escapeHtml(value) {
      return String(value ?? "-").replace(/[&<>"']/g, ch =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
    }

    document.getElementById("search").addEventListener("submit", event => {
      event.preventDefault();  // stop the browser reloading the page
      showCompany(document.getElementById("reg").value);
    });

    showCompany("SYN-001550");  // show an example straight away
  </script>
</body>
</html>
