[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika",
  "pandas>=3.1.1",
  "pika>=1.5.0",
  "psycopg[binary]>=3.3.9",
  "sentence-transformers>=6.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
